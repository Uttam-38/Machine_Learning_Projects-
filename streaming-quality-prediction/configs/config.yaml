artifacts_dir: artifacts
models_dir: artifacts/models
reports_dir: artifacts/reports

split:
  test_size: 0.2
  val_size: 0.1
  random_state: 42

model:
  type: xgboost
  reg_params:
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 1.0
  clf_params:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 1.0
